[workspace]
resolver = "2"
members = ["ir", "compiler", "vm", "tools/cli", "tools/prof", "rt", "runtime/aot", "backends/cranelift", "backends/x64"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
